[package]
name = "oxide-kv"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yuw1/oxide-kv"
description = "A lightweight distributed key-value store built in Rust, implementing the Raft Consensus Algorithm."

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"