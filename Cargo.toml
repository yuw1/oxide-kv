[workspace]
resolver = "2"
members = [
    "rust/oxide-kv",
    "rust/oxide-kv-client",
]

# Workspace-level settings shared by every member crate.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yuw1/oxide-kv"

# Lint inheritance: every member crate picks up these lints.
# `-D warnings` on the `cargo clippy` line still works because the
# nightly cron invokes clippy directly, not via the workspace.
[workspace.lints.clippy]
# Reserve the key for future workspace-wide lints; intentionally
# empty for now so member crates aren't surprised by a sudden
# tightening.