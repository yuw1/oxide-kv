[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide-kv"
version = "0.1.0"
description = "Python SDK for Oxide-KV, a Raft-based distributed KV store."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Calvin"}]
keywords = ["raft", "distributed", "kv-store", "key-value"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yuw1/oxide-kv"
Issues = "https://github.com/yuw1/oxide-kv/issues"
Changelog = "https://github.com/yuw1/oxide-kv/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oxide_kv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]