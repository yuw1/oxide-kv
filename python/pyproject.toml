[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide-kv"
version = "0.1.0"
description = "Python SDK for Oxide-KV, a Raft-based distributed KV store."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Calvin"}]
keywords = ["raft", "distributed", "kv-store", "key-value"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yuw1/oxide-kv"
Issues = "https://github.com/yuw1/oxide-kv/issues"
Changelog = "https://github.com/yuw1/oxide-kv/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oxide_kv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff configuration: ignore UP006/UP035/UP045 (typing modernization
# rules). The Python SDK targets Python 3.9+ but does not adopt the
# PEP 604 / PEP 585 runtime syntax (`X | None`, builtin generics)
# because the existing public API surface uses `typing.Optional`,
# `typing.List`, and `typing.Tuple` consistently. Migrating the
# whole SDK to the new syntax is out of scope for the immediate
# post-PR-#48 cleanup; tracking the lint debt here lets CI run
# `make lint` without failing on stylistic noise that has no
# functional impact.
[tool.ruff.lint]
ignore = ["UP006", "UP035", "UP045", "PYI034"]