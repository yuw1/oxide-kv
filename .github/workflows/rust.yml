name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    # P8 cleanup follow-up: enforce `cargo fmt` on every PR so the
    # codebase can't drift from rustfmt output. PR #57 brought the
    # entire workspace to fmt-clean as a one-shot mechanical pass;
    # this gate keeps it that way going forward.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install protoc
      # Required by build.rs (prost-build) inside rust/oxide-kv.
      # Not pre-installed on ubuntu-latest runners.
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Build (workspace)
      # Cargo workspace introduced by PR #34; must use `--workspace` so
      # both `rust/oxide-kv` (server) and `rust/oxide-kv-client`
      # (new client crate) are built.
      run: cargo build --workspace --verbose
    - name: Run tests (workspace, default only)
      # Default CI skips the fuzz scenarios in
      # `rust/oxide-kv/tests/raft_fuzz.rs` (`fuzz_default_seeds_*`,
      # `fuzz_long_seeds_*`, `fuzz_short_seeds_*`, `fuzz_smoke_single_seed`).
      # Those scenarios take ~8 minutes on a runner and are entirely
      # redundant with the nightly sweep (see
      # `.github/workflows/nightly.yml`, which runs
      # `fuzz_nightly_seeds_10000_to_11000`, 1000 scenarios × 25 actions).
      # The shrink property tests (`shrink_algorithm_*`) live in the same
      # file but are not skipped — they're millisecond-scale unit tests,
      # not scenarios, and gate the shrinker itself.
      #
      # The cross-process smoke test binary
      # (`tests/cross_process_smoke.rs`) is gated behind the
      # `cross-process-smoke` feature (see `rust/oxide-kv/Cargo.toml`),
      # so it's not built or run by this default sweep. The dedicated
      # smoke step below enables that feature and runs the suite
      # end-to-end with `--test-threads=1` and a release binary.
      run: cargo test --workspace --verbose -- --skip fuzz_
    - name: Run examples (workspace)
      # `--examples` is part of `--all-targets`, but call it explicitly so
      # future readers see the intent. The CLI example under
      # `rust/oxide-kv/examples/oxide_kv_cli.rs` exercises the new
      # `oxide-kv-client` crate end-to-end at build time.
      run: cargo build --workspace --examples --verbose
    - name: Cross-process 3-node smoke test (P8 PR 9)
      # Drives the real `oxide-kv` binary on three TCP ports (9001/9002/9003
      # for Raft RPC, 9101/9102/9103 for the JSON client protocol,
      # 9100/9200/9300 for `/metrics`). The test boots the cluster via
      # `deploy/scripts/bootstrap-cluster.sh`, verifies the metrics
      # endpoint + JSON client protocol, and tears down. See the
      # module docstring in `tests/cross_process_smoke.rs`; the
      # consensus-scope tests (single-leader convergence, commit
      # advance, Set+Get round trip) were once `#[ignore]`-gated on
      # the split-brain / commit-advance bugs and now run un-gated
      # (fixed by PRs #50/#51).
      #
      # The test binary is gated behind the `cross-process-smoke`
      # cargo feature (see `rust/oxide-kv/Cargo.toml` [[test]]
      # block: `required-features = ["cross-process-smoke"]`). This
      # stops the default CI test sweep from compiling + running
      # the heavy suite in parallel with the other test binaries,
      # which would collide on the fixed bootstrap ports.
      #
      # Serialized with `--test-threads=1` because each test case
      # spins up its own 3-node cluster; running them in parallel
      # would collide on the bootstrap ports.
      run: |
        set -euo pipefail
        cargo build --release --bin oxide-kv --verbose
        cargo test --release --test cross_process_smoke --features cross-process-smoke --verbose -- \
          --test-threads=1 --nocapture