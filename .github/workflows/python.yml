name: Python SDK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  PYTHON_DEFAULT: always

jobs:
  test:
    name: pytest on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install protoc
      # Mirror rust.yml; not strictly needed for the SDK itself
      # (no proto regeneration) but keeps the cache prime in case
      # a future PR wires in a Rust extension via maturin.
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install SDK + dev deps
      working-directory: python
      run: make install

    - name: Lint (ruff)
      working-directory: python
      run: make lint

    - name: Run tests
      # Boots a single-node oxide-kv server on 127.0.0.1:9001
      # (Raft) + 127.0.0.1:9101 (JSON client), waits for the
      # server to be ready, then runs `make test`. Defaults in
      # `tests/test_client.py` already point at 9101.
      working-directory: python
      run: |
        set -euo pipefail
        cargo build --release --bin oxide-kv --manifest-path ../rust/oxide-kv/Cargo.toml
        ./../rust/oxide-kv/target/release/oxide-kv \
          --addr 127.0.0.1:9001 \
          --client-addr 127.0.0.1:9101 \
          --metrics-addr disabled &
        SERVER_PID=$!
        # Wait for the JSON client port to accept connections.
        for _ in $(seq 1 30); do
          if (echo > /dev/tcp/127.0.0.1/9101) 2>/dev/null; then
            break
          fi
          sleep 0.2
        done
        trap "kill $SERVER_PID 2>/dev/null || true" EXIT
        make test