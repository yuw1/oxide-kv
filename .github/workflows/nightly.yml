name: nightly

# Daily fuzz sweep. Runs the `#[ignore]` `fuzz_nightly_seeds_10000_to_11000`
# test entry in `rust/oxide-kv/tests/raft_fuzz.rs` (1000 scenarios × 25
# actions), which is skipped by default CI to keep PR feedback fast. Driven
# on a cron so we surface safety violations within ~24h of landing.
#
# Manual trigger: GitHub UI → Actions → nightly → Run workflow.
# Local repro: cargo test --release --workspace --test raft_fuzz --
#              --ignored fuzz_nightly_seeds_10000_to_11000

on:
  schedule:
    # 02:00 UTC ≈ 10:00 Asia/Shanghai — quiet hour for the cluster
    - cron: '0 2 * * *'
  workflow_dispatch: # allow manual trigger from the Actions UI

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        # Required by build.rs (prost-build) inside rust/oxide-kv.
        # Not pre-installed on ubuntu-latest runners.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run nightly fuzz sweep
        # Single-threaded to keep the simulation deterministic; a single
        # nightly scenario drives a fresh 3-node cluster + 25 actions so
        # parallel runs wouldn't share state anyway. `--workspace` is
        # required after the PR #34 workspace restructure; the fuzz
        # harness itself now lives under `rust/oxide-kv/tests/`.
        run: |
          cargo build --release --workspace --tests
          cargo test --release --workspace --test raft_fuzz -- \
            --ignored fuzz_nightly_seeds_10000_to_11000 --nocapture