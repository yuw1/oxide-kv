[package]
name = "oxide-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A lightweight distributed key-value store built in Rust, implementing the Raft Consensus Algorithm."

[features]
# `cross-process-smoke` enables the heavy integration test binary
# `tests/cross_process_smoke.rs`, which spawns three real
# `oxide-kv` processes and exercises the deploy path. It is gated
# behind a feature so the default CI test sweep (which runs the
# test binary in debug mode and parallels multiple test binaries)
# skips it. The dedicated CI smoke step enables this feature
# plus `--release` to run the suite end-to-end.
cross-process-smoke = []


[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
prost = "0.13"
# `prometheus` is the metrics registry + text-format encoder used
# by the `/metrics` HTTP endpoint (P8 PR 8). The crate is
# dependency-free beyond `fnv` + an optional `protobuf` feature
# (we use the default `text` encoder), so pulling it in keeps the
# build graph flat. A future PR can gate this behind a
# `metrics` cargo feature flag once we have real opt-in demand.
prometheus = { version = "0.14", default-features = false }
# `oxide-kv-client` is the standalone Rust client crate (P8 PR 2).
# Pulled in here so the `examples/oxide_kv_cli.rs` example can
# demonstrate using it from the server crate's binary context.
# Cargo workspace resolves this from the sibling crate.
oxide-kv-client = { path = "../oxide-kv-client" }
# `tempfile` is used by the SimHarness (P7 foundation) in lib
# tests + the integration test suite. Keeping it as a regular
# dependency (not just dev-dep) lets the harness live in the
# library so it can be reused from any `tests/*.rs`.
tempfile = "3.10"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]`, which
# the SimClock determinism tests rely on. Feature is only pulled in
# for dev builds (test compilation), not for the release binary.
tokio = { version = "1.0", features = ["full", "test-util"] }
# Heavy cross-process smoke test gated behind the
# `cross-process-smoke` feature so the default CI test sweep
# (which runs the test binary in debug mode and parallels
# multiple test binaries) skips it. The dedicated CI smoke
# step enables this feature with `--release` to run the
# suite end-to-end.
[[test]]
name = "cross_process_smoke"
path = "tests/cross_process_smoke.rs"
required-features = ["cross-process-smoke"]
