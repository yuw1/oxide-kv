syntax = "proto3";

package oxide_kv.raft;

// Wire-format notes:
// - All RPC types below are emitted/consumed by prost on the Rust side.
// - Transport framing on the TCP socket is 4-byte big-endian length prefix
//   followed by the protobuf payload (length-prefixed framing is the standard
//   pattern over a byte stream; pure line-delimited JSON does not work for
//   binary protobuf).
//
// Schema covers the on-the-wire Raft RPC surface only. Storage formats
// (WAL, snapshot file, meta) and the external client command protocol are
// intentionally out of scope and remain on their existing formats.

// ---- Log entries (nested so AppendEntries can carry them) ----

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  Command command = 3;
}

message Command {
  oneof body {
    Set set = 1;
    Get get = 2;
    Delete delete = 3;
    Empty compact = 4;
    BeginTx begin_tx = 5;
    // Tag 6 (was `TxVote`) intentionally unused: in P6 the 2PC
    // coordinator votes travel on the side-channel RPC defined in
    // `proto/coordination.proto` rather than through the Raft log.
    // The tag is left open rather than `reserved` because `reserved`
    // cannot be declared inside a `oneof`; instead we simply omit the
    // variant and rely on the absence to discourage reuse.
    DecideTx decide_tx = 7;
    // P8 PR 6 (Raft thesis §6): client-facing membership commands.
    // The leader intercepts these in `MembershipCoordinator` and
    // replaces them with `ConfigurationEntry` log entries before
    // replication. They exist on the wire for completeness so the
    // type is closed, but in normal operation they never appear in a
    // log entry that another server observes. See
    // `src/raft/node.rs::MembershipCoordinator` for the policy.
    ServerId add_node = 8;          // AddNode { server }
    string remove_node = 9;         // RemoveNode { node_id }
    ConfigurationEntry install_configuration = 10; // InstallConfiguration
    // P8 PR 7: admin RPC. Client-facing force-abort for a stuck
    // 2PC transaction by tx_id. The leader intercepts this in
    // `RaftNode::propose_abort_tx` and translates it into a
    // `DecideTx{decision: Abort}` log entry (the same kind a
    // timeout sweep would emit). Followers reject AbortTx at the
    // JSON layer. Wire tag 11 is the next free slot after
    // InstallConfiguration.
    string abort_tx = 11;            // AbortTx { tx_id }
  }
}

message ServerId {
  string node_id = 1;
  string addr = 2;
}

// Committed membership configuration (Raft thesis §6).
//
// `Simple(servers)` is the steady state; `Joint { old, new }` is the
// transitional state during a single-server membership change. Once
// the Joint entry commits, the subsequent Simple entry commits via
// a quorum of `new` alone. Both phases are log entries, not RPCs,
// so they ride on the existing AppendEntries path.
message ConfigurationEntry {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SIMPLE = 1;
    KIND_JOINT = 2;
  }
  Kind kind = 1;
  repeated ServerId old_servers = 2;
  repeated ServerId new_servers = 3;
}

message Set {
  string key = 1;
  string value = 2;
}

message Get {
  string key = 1;
}

message Delete {
  string key = 1;
}

// Sentinel for the no-op Compact command (the wire format must always
// carry a payload for a `oneof` field).
message Empty {}

message TxOp {
  oneof body {
    Set put = 1;
    Delete delete = 2;
  }
}

message BeginTx {
  string tx_id = 1;
  repeated TxOp ops = 2;
}

// `TxVote` was removed in P6 (see `proto/coordination.proto`).
// Votes now travel on the side-channel RPC rather than through the
// Raft log. The Command body tag 6 is reserved above to prevent reuse.

message DecideTx {
  string tx_id = 1;
  bool commit = 2;
}

// ---- RPC arguments ----

message RequestVoteArgs {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message VoteResponseArgs {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendReplyArgs {
  uint64 term = 1;
  bool success = 2;
}

message Snapshot {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  map<string, string> data = 3;
}

message InstallSnapshotArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  Snapshot snapshot = 5;
}

message InstallSnapshotReplyArgs {
  uint64 term = 1;
}

// ---- Top-level RPC envelope (one per TCP request) ----

// `RaftMessage.body.request_pre_vote` (tag 7) and
// `RaftMessage.body.pre_vote_response` (tag 8) carry the
// pre-vote handshake added in P8 PR 5. They reuse the existing
// `RequestVoteArgs` / `VoteResponseArgs` wire types because the
// field shape is identical to a real RequestVote; the receiver
// distinguishes the two via the `RaftMessage.body` tag, not via
// an inner flag. Wire-level semantics: pre-vote **does not** bump
// `current_term` on either side (Raft §9.6). See
// `src/raft/node.rs::handle_pre_vote` for the policy.
// P8 PR 6a: cold-new-server catch-up. A brand-new server (with no
// peers configured) cannot be reached via the normal AppendEntries
// path because no one in the cluster knows its address. The new
// server therefore initiates contact: it sends `JoinClusterRequest`
// to a *hint* address it learned out-of-band (e.g. via DNS, systemd
// environment, or a manual bootstrap). If the hint reaches a leader
// in the cluster, the leader replies with its own address and the
// current peer list (minus the new server itself). The new server
// then calls `set_peers(...)` and waits to be added via the Joint
// consensus path (P8 PR 6). This is an RPC, not a log entry, so
// `JoinCluster` does not participate in quorum or replication.
message JoinClusterRequest {
  // The candidate's own address (the leader will use this to add
  // the candidate to the cluster later via `propose_add_node`).
  // Identical to `ServerId.addr`; we don't send `node_id` because
  // in v1 node_id == addr.
  string candidate_addr = 1;
}

message JoinClusterResponse {
  bool accepted = 1;
  // Leader's current term. The candidate uses this to detect that
  // the hint may have routed to a stale leader; if so, it can fall
  // back to another hint.
  uint64 term = 2;
  // The leader's address (so the candidate can issue `set_peers`
  // and then await `AddNode`). Same as candidate learned in v1.
  string leader_addr = 3;
  // Current peer addresses (excluding the candidate and the leader).
  // Empty when `accepted=false`.
  repeated string peer_addrs = 4;
  // Human-readable reason when `accepted=false`. Empty otherwise.
  // Not parsed by clients; only surfaced in logs.
  string reason = 5;
}

message RaftMessage {
  oneof body {
    RequestVoteArgs request_vote = 1;
    VoteResponseArgs vote_response = 2;
    AppendEntriesArgs append_entries = 3;
    AppendReplyArgs append_reply = 4;
    InstallSnapshotArgs install_snapshot = 5;
    InstallSnapshotReplyArgs install_snapshot_reply = 6;
    RequestVoteArgs request_pre_vote = 7;
    VoteResponseArgs pre_vote_response = 8;
    // P8 PR 6a: see JoinClusterRequest / JoinClusterResponse
    // doc-comments above. The candidate is the caller; the leader
    // is the responder. Followers reject with `accepted=false`.
    JoinClusterRequest join_cluster = 9;
    JoinClusterResponse join_cluster_response = 10;
  }
}