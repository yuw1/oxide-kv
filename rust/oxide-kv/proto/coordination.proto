syntax = "proto3";

package oxide_kv.coordination;

// =============================================================================
// 2PC coordinator RPC (side-channel from Raft).
// =============================================================================
//
// The Raft log only carries `BeginTx` and `DecideTx` (see `proto/raft.proto`).
// Between those two log entries, the leader (acting as 2PC coordinator)
// asks every peer "is this transaction safe to commit?" by sending a
// `VoteRequest` and collecting `VoteResponse`s via this side-channel RPC.
//
// Why a separate proto file:
//   - Keeps the 2PC coordinator surface physically isolated from the Raft
//     wire schema; the two evolve independently.
//   - Matches the "two concerns, two files" pattern from `raft.proto`.
//
// Wire format:
//   - Same length-prefixed protobuf framing as Raft (see `raft.proto` header).
//     PR #12 will pick a transport (separate port vs. multiplexed socket)
//     and a dispatch envelope; this PR only locks down the message shapes.
//
// Semantics:
//   - `term`: leader's current Raft term at the time the request was sent.
//     Recipient uses this to detect leader changes and reject stale votes
//     (any future leader-leases work can build on this field).
//   - `tx_id`: the BeginTx being voted on; matches `BeginTx.tx_id` in
//     `raft.proto` and `pending_txs` keys in the state machine.
//   - `last_log_index` / `last_log_term`: the leader's log tip at request
//     time, mirroring Raft's RequestVote semantics. Lets a peer cross-check
//     the leader hasn't fallen behind before granting a vote.
//   - `vote_granted`: true iff the peer is willing to commit this tx.
//   - `reason`: short human-readable diagnostic populated when
//     `vote_granted = false` (e.g. "conflict on key k", "tx not pending").
//     Empty when granted.
//
// Quorum policy (locked at PR #11 spec time):
//   - **All-yes required.** Any No vote, any timeout, or any unreachable
//     peer aborts the transaction. This is textbook 2PC; majority quorum
//     is intentionally not used here (see ROADMAP.md P6 decision notes).
// =============================================================================

message VoteRequest {
  uint64 term = 1;
  string tx_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
  // Short diagnostic when `vote_granted = false`. Empty when granted.
  string reason = 3;
}